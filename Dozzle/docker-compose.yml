# Official Dozzle Docker Log Viewer Compose
# Reference: https://dozzle.dev/guide/getting-started

services:
  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle-log-viewer
    restart: unless-stopped
    ports:
      - "8888:8080"
    environment:
      - DOZZLE_LEVEL=info
      - DOZZLE_NO_ANALYTICS=true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - pipeline_net

networks:
  pipeline_net:
    name: cicd_pipeline_network
    external: true
