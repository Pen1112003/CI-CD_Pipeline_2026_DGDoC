# Master CI/CD Pipeline Docker Compose
# Tích hợp toàn bộ các dịch vụ: Jenkins, SonarQube (PostgreSQL), Dozzle

services:
  # 1. Jenkins LTS
  jenkins:
    image: ${JENKINS_IMAGE:-jenkins/jenkins:lts-jdk17}
    container_name: jenkins-lts
    restart: unless-stopped
    privileged: true
    user: root
    ports:
      - "${JENKINS_PORT:-8080}:8080"
      - "${JENKINS_AGENT_PORT:-50000}:50000"
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=true
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ./monitoring/logs/jenkins:/var/log/jenkins
      - ./monitoring/reports:/reports
    networks:
      - cicd_network

  # 2. SonarQube Server
  sonarqube:
    image: ${SONARQUBE_IMAGE:-sonarqube:lts-community}
    container_name: sonarqube-server
    restart: unless-stopped
    depends_on:
      sonar-db:
        condition: service_healthy
    ports:
      - "${SONARQUBE_PORT:-9000}:9000"
    environment:
      - SONAR_JDBC_USERNAME=${SONAR_DB_USER:-sonar}
      - SONAR_JDBC_PASSWORD=${SONAR_DB_PASSWORD:-sonar_secure_password_2026}
      - SONAR_JDBC_URL=jdbc:postgresql://sonar-db:5432/${SONAR_DB_NAME:-sonar}
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - ./monitoring/logs/sonarqube:/opt/sonarqube/logs
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    networks:
      - cicd_network

  # 3. SonarQube PostgreSQL Database
  sonar-db:
    image: ${POSTGRES_IMAGE:-postgres:15-alpine}
    container_name: sonarqube-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${SONAR_DB_USER:-sonar}
      - POSTGRES_PASSWORD=${SONAR_DB_PASSWORD:-sonar_secure_password_2026}
      - POSTGRES_DB=${SONAR_DB_NAME:-sonar}
    volumes:
      - postgresql_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SONAR_DB_USER:-sonar} -d ${SONAR_DB_NAME:-sonar}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cicd_network

  # 4. Dozzle - Realtime Docker Logs Viewer
  dozzle:
    image: ${DOZZLE_IMAGE:-amir20/dozzle:latest}
    container_name: dozzle-log-viewer
    restart: unless-stopped
    ports:
      - "${DOZZLE_PORT:-8888}:8080"
    environment:
      - DOZZLE_LEVEL=${DOZZLE_LOG_LEVEL:-info}
      - DOZZLE_NO_ANALYTICS=true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - cicd_network

volumes:
  jenkins_home:
    name: jenkins_home_data
  sonarqube_data:
    name: sonarqube_data
  sonarqube_extensions:
    name: sonarqube_extensions
  postgresql_data:
    name: sonarqube_pg_data

networks:
  cicd_network:
    name: ${PIPELINE_NETWORK_NAME:-cicd_pipeline_network}
    driver: bridge
